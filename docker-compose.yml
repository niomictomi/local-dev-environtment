services:
  # --- POSTGRESQL DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

  # --- PGADMIN (GUI POSTGRES) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: local_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # --- MYSQL DATABASE ---
  mysql:
    image: mysql:8.0
    container_name: local_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: local_db
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql

  # --- PHPMYADMIN (GUI MYSQL) ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: local_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - mysql

  # --- REDIS CACHE ---
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data

  # --- MINIO (OBJECT STORAGE / S3) ---
  # minio:
  #   image: quay.io/minio/aistor/minio:latest
  #   container_name: local_minio
  #   restart: always
  #   environment:
  #     MINIO_ROOT_USER: root
  #     MINIO_ROOT_PASSWORD: password
  #   ports:
  #     - "9002:9000"       # Port untuk API aplikasi (Laravel/S3 Client)
  #     - "9001:9001"       # Port untuk Web Dashboard Console
  #   volumes:
  #     - ./volumes/minio:/data
  #   command: server /data --console-address ":9001"

  garage:
      image: dxflrs/garage:v2.5.0  # Sesuaikan dengan versi stabil terbaru
      container_name: local_garage
      restart: always
      ports:
        - "3900:3900"  # S3 API Port
        - "3901:3901"  # Admin API Port (opsional)
      volumes:
        - ./volumes/garage/data:/var/lib/garage/data
        - ./volumes/garage/meta:/var/lib/garage/meta
        - ./volumes/garage/config/garage.toml:/etc/garage.toml  # <--- Tambahkan baris ini

